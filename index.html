<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>고장난 변기통</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}body{background:#080b10;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center}#game{width:min(760px,100vw);height:100dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%,#303943,#11161d 55%,#07090c)}header{text-align:center;padding:14px 12px 4px}h1{margin:0;font-size:clamp(30px,8vw,52px);font-weight:1000;letter-spacing:-2px;text-shadow:0 4px #000}.sub{font-size:12px;color:#aab4bf;font-weight:800}button{font:inherit}#mute{position:absolute;right:12px;top:12px;background:#151b22;color:#fff;border:1px solid #39434d;border-radius:10px;padding:7px 9px}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 14px}.box{background:#121820;border:1px solid #303943;border-radius:14px;padding:8px;text-align:center;box-shadow:0 8px 20px #0007}.label{font-size:10px;color:#8995a2;font-weight:900}.value{font-size:21px;font-weight:1000}#combo{color:#ffc13c}#comboBox.hot{border-color:#ffb31b;box-shadow:0 0 20px #ffad0038}#progress{padding:0 18px}.bar{height:12px;background:#080a0d;border:1px solid #303943;border-radius:99px;overflow:hidden}#damage{width:0;height:100%;background:linear-gradient(90deg,#61d85d,#ffc62d,#ff583d,#dc0037);transition:width .1s}#damageText{text-align:center;margin-top:4px;font-size:11px;color:#8994a0;font-weight:800}#toiletArea{position:absolute;left:0;right:0;top:205px;bottom:160px;display:flex;align-items:center;justify-content:center}#toilet{position:relative;width:min(68vw,390px);aspect-ratio:1;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 25px 22px #000a)}.tank{position:absolute;left:22%;top:4%;width:56%;height:27%;border:9px solid #d9dddf;background:linear-gradient(#fafafa,#aeb6bb);border-radius:20px 20px 12px 12px;box-shadow:inset 0 -12px 18px #70798077,0 6px #686f73}.lid{position:absolute;z-index:3;left:17%;top:25%;width:66%;height:18%;border:9px solid #dce0e2;background:#f3f4f4;border-radius:50% 50% 35% 35%;box-shadow:0 6px #70787c}.bowl{position:absolute;z-index:2;left:10%;top:36%;width:80%;height:48%;border:11px solid #dce0e2;background:linear-gradient(#fafafa,#aab2b7);border-radius:25% 25% 42% 42%;box-shadow:inset 0 -20px 25px #70798066,0 7px #697175}.water{position:absolute;z-index:4;left:22%;top:51%;width:56%;height:19%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#d8ffff,#4dc4dc 48%,#197c9b);box-shadow:inset 0 6px 8px #fff8}.base{position:absolute;left:22%;bottom:3%;width:56%;height:25%;background:#d9dddf;border-radius:18px 18px 35px 35px;box-shadow:inset 0 -14px 20px #7d858a66,0 7px #697175}.crack{display:none;position:absolute;z-index:8;width:4px;background:#25292c;border-radius:5px}.c1{height:85px;left:39%;top:28%;transform:rotate(25deg)}.c2{height:62px;left:51%;top:39%;transform:rotate(-40deg)}.c3{height:75px;left:63%;top:49%;transform:rotate(30deg)}.c4{height:50px;left:29%;top:57%;transform:rotate(-55deg)}#toilet.broken .crack{display:block}#toilet.broken .water{background:radial-gradient(ellipse,#b4ff82,#43a73d 55%,#155923)}#toilet.shake{animation:shake .15s linear}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-8px,4px) rotate(-2deg)}50%{transform:translate(8px,-4px) rotate(2deg)}75%{transform:translate(-5px,-2px)}}#event{position:absolute;left:14px;right:14px;bottom:122px;min-height:58px;background:#151b23ee;border:1px solid #39444f;border-radius:16px;padding:9px 13px;text-align:center;box-shadow:0 10px 30px #0008}#eventTitle{font-weight:1000;color:#ffc13b}#eventText{font-size:12px;color:#c2cad2;font-weight:700;margin-top:2px}#hint{position:absolute;bottom:88px;left:0;right:0;text-align:center;color:#788490;font-size:11px;font-weight:800}#tap{position:absolute;left:18px;right:18px;bottom:25px;height:54px;border:0;border-radius:17px;background:linear-gradient(#ff6b48,#d63b25);color:#fff;font-size:18px;font-weight:1000;box-shadow:0 6px #8d2618,0 12px 30px #0008;touch-action:manipulation}#tap:active{transform:translateY(5px);box-shadow:0 2px #8d2618}.floating{position:absolute;z-index:20;pointer-events:none;font-size:23px;font-weight:1000;text-shadow:0 3px #000;animation:float .8s ease-out forwards}@keyframes float{to{opacity:0;transform:translate(-50%,-90px) scale(1.25)}}#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}#flash.on{animation:flash .16s}@keyframes flash{0%{opacity:.65}100%{opacity:0}}.overlay{position:absolute;inset:0;z-index:50;background:#050608dd;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:22px}.overlay.show{display:flex}.card{width:min(500px,100%);background:#12171e;border:1px solid #39434d;border-radius:24px;padding:27px;text-align:center;box-shadow:0 25px 80px #000}.card h2{font-size:34px;margin:0}.ending{font-size:19px;font-weight:1000;color:#ffc03a;margin:16px 0}.small{font-size:12px;color:#99a4b0;font-weight:700}#finalScore{font-size:44px;font-weight:1000}#restart{width:100%;height:52px;margin-top:18px;border:0;border-radius:15px;background:#fff;color:#111;font-size:17px;font-weight:1000}@media(max-height:680px){header{padding-top:7px}.hud{padding:4px 12px}.value{font-size:17px}#toiletArea{top:165px;bottom:145px}#event{bottom:108px}#hint{bottom:78px}#tap{bottom:18px}}
</style></head><body><div id="game"><header><h1>🚽 고장난 변기통</h1><div class="sub">누르면 누를수록 상태가 이상해진다.</div></header><button id="mute">🔊</button><div class="hud"><div class="box"><div class="label">SCORE</div><div class="value" id="score">0</div></div><div class="box" id="comboBox"><div class="label">COMBO</div><div class="value" id="combo">x0</div></div><div class="box"><div class="label">MAX COMBO</div><div class="value" id="maxCombo">0</div></div></div><div id="progress"><div class="bar"><div id="damage"></div></div><div id="damageText">고장도 0%</div></div><div id="toiletArea"><div id="toilet"><div class="tank"></div><div class="lid"></div><div class="bowl"></div><div class="water"></div><div class="base"></div><div class="crack c1"></div><div class="crack c2"></div><div class="crack c3"></div><div class="crack c4"></div></div></div><div id="event"><div id="eventTitle">⚠️ 평화로운 변기통</div><div id="eventText">아무 일도 일어나지 않았다. 아직은.</div></div><div id="hint">변기 또는 버튼을 연타하세요</div><button id="tap">💥 변기통 고장내기</button><div id="flash"></div><div class="overlay" id="overlay"><div class="card"><h2>🚨 GAME OVER</h2><div class="ending" id="ending"></div><div class="small">최종 점수</div><div id="finalScore">0</div><div class="small" id="finalStats"></div><button id="restart">다시 고장내기</button></div></div></div>
<script>
(()=>{let score=0,combo=0,maxCombo=0,damage=0,taps=0,running=true,lastTap=0,muted=false,comboTimer,ctx=null;const $=id=>document.getElementById(id),toilet=$('toilet'),game=$('game');function audio(){if(muted)return null;if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function beep(f=220,d=.07,type='square',g=.035){let c=audio();if(!c)return;let o=c.createOscillator(),a=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(55,f*.55),c.currentTime+d);a.gain.setValueAtTime(g,c.currentTime);a.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(a);a.connect(c.destination);o.start();o.stop(c.currentTime+d)}function vib(p=18){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}const events=[['🚔 경찰 출동','경찰 순찰차 세 대 보냅니다.',250,6],['📦 CJ 대한통운','엄마 이게 뭔지 알아요? CJ 대한통운이잖아요.',400,8],['🌈 정체불명의 손님','쌍 놈이건 넘이건 쌍 게이던… 일단 변기는 친다.',600,12],['🧻 휴지 대폭발','휴지가 갑자기 엄청나게 많이 나왔다!',350,6],['💧 수압 폭주','수압이 비정상적으로 상승했다!',500,10],['👻 변기통의 분노','변기통이 당신을 기억하기 시작했다.',800,15],['🛸 UFO 착륙','왜 화장실에 UFO가 착륙했는지는 아무도 모른다.',1000,18],['🧑‍🔧 긴급 정비공','정비공이 왔지만 아무것도 고치지 않았다.',100,-4]];function update(){score=Math.floor(score);$('score').textContent=score.toLocaleString();$('combo').textContent='x'+combo;$('maxCombo').textContent=maxCombo;$('damage').style.width=damage+'%';$('damageText').textContent='고장도 '+Math.floor(damage)+'%';$('comboBox').classList.toggle('hot',combo>=5);if(damage>=55)toilet.classList.add('broken')}function event(){let e=events[Math.floor(Math.random()*events.length)];$('eventTitle').textContent=e[0];$('eventText').textContent=e[1];score=Math.max(0,score+e[2]);damage=Math.max(0,Math.min(100,damage+e[3]));beep(520,.07,'triangle');setTimeout(()=>beep(780,.1,'triangle',.025),70);vib(35);update()}function hit(x,y){if(!running)return;let now=performance.now(),fast=now-lastTap<650;lastTap=now;taps++;combo=fast?combo+1:1;maxCombo=Math.max(maxCombo,combo);clearTimeout(comboTimer);comboTimer=setTimeout(()=>{combo=0;update()},750);let points=Math.round((50+Math.random()*40)*(1+Math.min(combo,20)*.08));score+=points;damage=Math.min(100,damage+(1.7+Math.random()*2.5)*(1+Math.min(combo,15)*.025));toilet.classList.remove('shake');void toilet.offsetWidth;toilet.classList.add('shake');$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');beep(100+Math.random()*90,.055);setTimeout(()=>beep(65,.07,'sawtooth',.025),30);vib(combo>=10?35:18);if(x!=null){let f=document.createElement('div');f.className='floating';f.textContent='+'+points;f.style.left=x+'px';f.style.top=y+'px';game.appendChild(f);setTimeout(()=>f.remove(),850)}if(Math.random()<.055)event();if(damage>=100)end();update()}function end(){if(!running)return;running=false;damage=100;update();[180,130,90].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sawtooth',.04),i*130));vib([100,60,100,60,250]);let ending=score<2500?'🔧 어설픈 고장 — 정비공이 한숨 쉬었다.':score<6000?'🚽 공식 고장 — 변기통이 더 이상 정상 작동하지 않습니다.':score<10000?'🚨 대형 사고 — 경찰 순찰차 세 대가 출동했습니다.':score<16000?'📦 CJ 대한통운급 사건 — 누가 이걸 배송했는지 조사 중.':'👑 전설의 변기 파괴자 — 화장실 역사에 이름을 남겼습니다.';$('ending').textContent=ending;$('finalScore').textContent=score.toLocaleString();$('finalStats').textContent=`총 ${taps}회 타격 · 최대 콤보 x${maxCombo}`;$('overlay').classList.add('show')}function restart(){score=combo=maxCombo=damage=taps=0;running=true;lastTap=0;$('overlay').classList.remove('show');toilet.classList.remove('broken');$('eventTitle').textContent='⚠️ 평화로운 변기통';$('eventText').textContent='아무 일도 일어나지 않았다. 아직은.';update()}$('tap').addEventListener('pointerdown',e=>{e.preventDefault();hit(game.clientWidth/2,game.clientHeight-100)});toilet.addEventListener('pointerdown',e=>{e.preventDefault();let r=game.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)});$('restart').addEventListener('click',restart);$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(!muted)beep(440,.08,'triangle',.03)});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();hit(game.clientWidth/2,game.clientHeight/2)}if(e.key.toLowerCase()==='r'&&!running)restart()});update()})();
</script></body></html>
