<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>고장난 변기통 2.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#05070a;color:#fff}
button{font:inherit}#app{width:min(900px,100vw);height:100dvh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#29323c,#11171e 48%,#07090d)}
header{height:68px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;background:#0a0e13dd;position:relative;z-index:10}
.logo{font-size:24px;font-weight:1000;letter-spacing:-1.5px}.logo small{display:block;font-size:8px;color:#84909d;letter-spacing:1px}.money{font-size:17px;font-weight:1000;color:#ffd04a}
.topbtn{background:#151b22;border:1px solid #39434e;color:#fff;border-radius:9px;padding:6px 8px;margin-left:4px}
#topButtons{display:flex;align-items:center}
#hud{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px;padding:7px 9px;position:relative;z-index:8}.stat{background:#10161eeb;border:1px solid #303943;border-radius:11px;padding:5px 8px}.stat b{display:block;font-size:8px;color:#7f8b98}.stat span{font-weight:1000;font-size:14px}.meter{height:6px;background:#06080b;border-radius:99px;overflow:hidden;margin-top:3px}.fill{height:100%;width:0;transition:.15s}#hpFill{background:linear-gradient(90deg,#6bdf70,#ffc531,#ff4f35)}#pressureFill{background:linear-gradient(90deg,#54d8ff,#8b74ff,#ff4e6b)}#comboFill{background:linear-gradient(90deg,#ffc531,#ff6d38)}
#scene{position:absolute;top:132px;left:0;right:0;bottom:242px}.sceneMsg{position:absolute;top:7px;left:10px;right:10px;text-align:center;z-index:20}.sceneMsg strong{display:inline-block;background:#090d13e8;border:1px solid #394552;border-radius:999px;padding:6px 12px;color:#ffca42;font-size:11px}
#toilet{position:absolute;width:min(335px,69vw);aspect-ratio:1;left:50%;top:53%;transform:translate(-50%,-50%);filter:drop-shadow(0 24px 22px #000b)}
.part{position:absolute;cursor:pointer;touch-action:manipulation}
#tank{left:22%;top:5%;width:56%;height:27%;border:9px solid #dce1e3;background:linear-gradient(#fafafa,#adb6bb);border-radius:20px 20px 12px 12px;box-shadow:inset 0 -15px 20px #68747c66,0 6px #687075}
#lid{left:17%;top:26%;width:66%;height:17%;border:9px solid #dce1e3;background:#f5f6f6;border-radius:50% 50% 35% 35%;box-shadow:0 6px #6b7377;z-index:3}
#bowl{left:10%;top:37%;width:80%;height:48%;border:11px solid #dce1e3;background:linear-gradient(#fafafa,#aeb6ba);border-radius:25% 25% 42% 42%;box-shadow:inset 0 -22px 26px #66717966,0 7px #687075;z-index:2}
#water{left:22%;top:52%;width:56%;height:18%;border-radius:50%;background:radial-gradient(ellipse,#d9ffff,#50c8df 50%,#167895);z-index:4;box-shadow:inset 0 5px 8px #fff8}
#base{left:22%;bottom:3%;width:56%;height:25%;background:#d9dddf;border-radius:18px 18px 35px 35px;box-shadow:inset 0 -14px 20px #70798055,0 7px #687075}
#lever{left:75%;top:15%;width:23%;height:10%;z-index:6;transform:rotate(-8deg)}#lever:before{content:"";position:absolute;right:0;top:0;width:52px;height:12px;border-radius:8px;background:#777;box-shadow:0 3px #444}#lever:after{content:"";position:absolute;right:40px;top:3px;width:27px;height:5px;background:#666}
.crack{position:absolute;width:4px;background:#24282c;border-radius:5px;z-index:9;transform-origin:top;opacity:0}.cr1{left:39%;top:29%;height:80px;transform:rotate(25deg)}.cr2{left:51%;top:40%;height:58px;transform:rotate(-40deg)}.cr3{left:63%;top:50%;height:70px;transform:rotate(30deg)}.cr4{left:30%;top:58%;height:48px;transform:rotate(-55deg)}.broken .crack{opacity:1}
#scene.shake #toilet{animation:shake .15s linear}@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 7px),calc(-50% + 3px)) rotate(-2deg)}50%{transform:translate(calc(-50% + 8px),calc(-50% - 3px)) rotate(2deg)}75%{transform:translate(calc(-50% - 4px),calc(-50% - 2px))}}
.float{position:absolute;z-index:50;pointer-events:none;font-weight:1000;font-size:20px;text-shadow:0 3px #000;animation:float .8s forwards}@keyframes float{to{opacity:0;transform:translate(-50%,-80px) scale(1.3)}}
#bottom{position:absolute;left:0;right:0;bottom:0;height:242px;background:#0a0f15f5;border-top:1px solid #35404b;z-index:15;padding:7px 9px}
#tools{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px}.tool{border:1px solid #343e49;background:#151c24;border-radius:10px;color:#fff;padding:5px 2px;min-height:55px;cursor:pointer;position:relative}.tool.selected{border-color:#ffc531;box-shadow:0 0 15px #ffc53122;background:#24251e}.tool .ico{font-size:19px}.tool b{display:block;font-size:9px}.tool small{color:#84909c;font-size:7px}.tool .lv{position:absolute;right:3px;top:2px;color:#ffc531;font-size:7px}
#parts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.partBtn{border:1px solid #313b46;background:#121820;color:#fff;border-radius:9px;padding:6px 2px;cursor:pointer}.partBtn b{font-size:10px}.partBtn small{display:block;color:#7f8b98;font-size:7px;margin-top:2px}
#action{width:100%;height:42px;margin-top:6px;border:0;border-radius:11px;background:linear-gradient(#ff6546,#d93824);color:#fff;font-weight:1000;box-shadow:0 4px #842518;cursor:pointer}#action:active{transform:translateY(3px);box-shadow:0 1px #842518}
.modalWrap{position:absolute;inset:0;z-index:100;background:#030508dd;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:16px}.modal{width:min(520px,100%);background:#121820;border:1px solid #3b4652;border-radius:21px;padding:21px;box-shadow:0 25px 80px #000;text-align:center}.modal h2{margin:0 0 5px;font-size:27px}.desc{font-size:12px;color:#aab4bf;line-height:1.5}.choices{display:grid;gap:7px;margin-top:14px}.choice{border:1px solid #394550;background:#19212a;color:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer}.choice b{display:block;color:#ffc531}.choice small{color:#929eaa}
#shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.buy{border:1px solid #394550;background:#19212a;color:#fff;border-radius:11px;padding:10px;cursor:pointer}.buy b{display:block;font-size:12px}.buy small{color:#8995a2;font-size:9px}.close{margin-top:11px;width:100%;height:41px;border:0;border-radius:11px;background:#fff;color:#111;font-weight:1000}
.ending{font-size:17px;font-weight:1000;color:#ffc531;margin:13px 0}.final{font-size:44px;font-weight:1000}
@media(max-height:690px){header{height:56px;padding:6px 9px}.logo{font-size:20px}#hud{padding:5px 8px}#scene{top:112px;bottom:210px}#bottom{height:210px}.tool{min-height:46px}.tool .ico{font-size:16px}#action{height:36px;margin-top:4px}}
</style>
</head>
<body>
<div id="app">
<header>
<div class="logo">🚽 고장난 변기통 2.0<small>THE TOILET MUST BREAK</small></div>
<div id="topButtons"><div class="money">💰 <span id="money">0</span></div><button class="topbtn" id="shop">🧰</button><button class="topbtn" id="mute">🔊</button></div>
</header>
<div id="hud">
<div class="stat"><b>변기 내구도</b><span id="hp">100</span><div class="meter"><div class="fill" id="hpFill"></div></div></div>
<div class="stat"><b>수압</b><span id="pressure">20</span><div class="meter"><div class="fill" id="pressureFill"></div></div></div>
<div class="stat"><b>콤보</b><span id="combo">x0</span><div class="meter"><div class="fill" id="comboFill"></div></div></div>
<div class="stat"><b>점수</b><span id="score">0</span></div>
</div>
<div id="scene">
<div class="sceneMsg"><strong id="msg">어디부터 고장낼까?</strong></div>
<div id="toilet">
<div id="tank" class="part" data-part="tank"></div><div id="lid" class="part" data-part="lid"></div><div id="bowl" class="part" data-part="bowl"></div><div id="water" class="part" data-part="drain"></div><div id="base" class="part" data-part="base"></div><div id="lever" class="part" data-part="lever"></div>
<div class="crack cr1"></div><div class="crack cr2"></div><div class="crack cr3"></div><div class="crack cr4"></div>
</div></div>
<div id="bottom">
<div id="tools">
<button class="tool selected" data-tool="hand"><span class="ico">👊</span><b>맨손</b><small>기본 타격</small><span class="lv">Lv.1</span></button>
<button class="tool" data-tool="hammer"><span class="ico">🔨</span><b>망치</b><small>강력 타격</small><span class="lv">Lv.1</span></button>
<button class="tool" data-tool="plunger"><span class="ico">🪠</span><b>뚫어뻥</b><small>수압 폭발</small><span class="lv">Lv.1</span></button>
<button class="tool" data-tool="wrench"><span class="ico">🔧</span><b>렌치</b><small>정밀 공격</small><span class="lv">Lv.1</span></button>
<button class="tool" data-tool="mystery"><span class="ico">❓</span><b>정체불명</b><small>결과 불명</small><span class="lv">Lv.1</span></button>
</div>
<div id="parts">
<button class="partBtn" data-part-select="tank"><b>🚰 물탱크</b><small>수압 증가</small></button>
<button class="partBtn" data-part-select="lever"><b>🕹️ 레버</b><small>콤보 보너스</small></button>
<button class="partBtn" data-part-select="bowl"><b>💥 몸통</b><small>내구도 감소</small></button>
<button class="partBtn" data-part-select="drain"><b>🌊 배수구</b><small>위험 증가</small></button>
</div>
<button id="action">💥 선택한 부위 공격하기</button>
</div>

<div class="modalWrap" id="eventModal"><div class="modal"><h2 id="eventTitle"></h2><div class="desc" id="eventDesc"></div><div class="choices" id="choices"></div></div></div>
<div class="modalWrap" id="shopModal"><div class="modal"><h2>🧰 부품 상점</h2><div class="desc">번 돈으로 도구를 강화한다.</div><div id="shopGrid"></div><button class="close" id="shopClose">닫기</button></div></div>
<div class="modalWrap" id="endModal"><div class="modal"><h2>🚨 변기통 최종 보고서</h2><div class="ending" id="ending"></div><div class="desc">최종 점수</div><div class="final" id="finalScore">0</div><div class="desc" id="finalStats"></div><button class="close" id="restart">다시 시작</button></div></div>
</div>
<script>
(()=>{let hp=100,pressure=20,score=0,money=0,combo=0,maxCombo=0,taps=0,selectedTool='hand',selectedPart='bowl',running=true,lastAction=0,comboTimer,muted=false;
const $=x=>document.getElementById(x),scene=$('scene'),tools={hand:{name:'맨손',damage:5,pressure:2,cost:0},hammer:{name:'망치',damage:12,pressure:5,cost:40},plunger:{name:'뚫어뻥',damage:4,pressure:16,cost:50},wrench:{name:'렌치',damage:9,pressure:3,cost:60},mystery:{name:'정체불명',damage:18,pressure:10,cost:100}},levels={hand:1,hammer:1,plunger:1,wrench:1,mystery:1},parts={tank:'물탱크',lever:'레버',bowl:'변기 몸통',drain:'배수구'};
let ac=null;function beep(f=220,d=.07,type='square',g=.03){if(muted)return;if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(g,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}function vib(x=18){if(navigator.vibrate)try{navigator.vibrate(x)}catch(e){}}
function update(){$('hp').textContent=Math.max(0,Math.ceil(hp));$('pressure').textContent=Math.floor(pressure);$('combo').textContent='x'+combo;$('score').textContent=score.toLocaleString();$('money').textContent=money.toLocaleString();$('hpFill').style.width=hp+'%';$('pressureFill').style.width=Math.min(100,pressure)+'%';$('comboFill').style.width=Math.min(100,combo*5)+'%';if(hp<55)$('toilet').classList.add('broken')}
function selectTool(t){selectedTool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('selected',b.dataset.tool===t));$('msg').textContent=tools[t].name+' 선택됨'}
function selectPart(p){selectedPart=p;document.querySelectorAll('.partBtn').forEach(b=>b.style.borderColor=b.dataset.partSelect===p?'#ffc531':'');$('msg').textContent=parts[p]+'을(를) 노린다.'}
function floating(txt){let f=document.createElement('div');f.className='float';f.textContent=txt;f.style.left='50%';f.style.top='48%';$('app').appendChild(f);setTimeout(()=>f.remove(),800)}
function attack(){if(!running)return;let now=performance.now(),fast=now-lastAction<800;lastAction=now;taps++;combo=fast?combo+1:1;maxCombo=Math.max(maxCombo,combo);clearTimeout(comboTimer);comboTimer=setTimeout(()=>{combo=0;update()},900);let t=tools[selectedTool],lv=levels[selectedTool],d=t.damage*lv,p=t.pressure,m=1+Math.min(combo,15)*.07;
if(selectedPart==='tank'){p*=1.8;d*=.7}if(selectedPart==='lever'){d*=.75;combo+=1}if(selectedPart==='drain'){p*=1.35;d*=.8}if(selectedTool==='plunger'&&selectedPart==='drain')d*=1.7;if(selectedTool==='hammer'&&selectedPart==='bowl')d*=1.45;if(selectedTool==='wrench'&&selectedPart==='lever')d*=1.6;
if(selectedTool==='mystery'){let r=Math.random();if(r<.18){d*=3;p*=2;$('msg').textContent='🤯 말도 안 되는 대성공!'}else if(r<.4){d=1;p=25;$('msg').textContent='💦 수압 폭주!'}}
let crit=Math.random()<Math.min(.25,.04+combo*.008);if(crit){d*=2;score+=300;money+=15;$('msg').textContent='💥 CRITICAL!'}d*=m;hp=Math.max(0,hp-d);pressure=Math.min(100,pressure+p);let pts=Math.round(d*30+p*5+combo*12);score+=pts;money+=Math.max(1,Math.floor(pts/180));scene.classList.remove('shake');void scene.offsetWidth;scene.classList.add('shake');beep(selectedTool==='hammer'?90:130+Math.random()*90,.06,selectedTool==='plunger'?'sine':'square',.04);vib(crit?45:18);floating((crit?'CRIT ':'+')+pts);if(Math.random()<.08)randomEvent();if(pressure>=100)pressureBurst();update();if(hp<=0)end()}
function pressureBurst(){score+=700;money+=80;hp=Math.max(0,hp-8);pressure=35;$('msg').textContent='🌊 수압 대폭발! +700';beep(70,.3,'sawtooth',.06);vib([50,30,100])}
const events=[
['🚔 경찰 순찰차 세 대 보냅니다','누군가 변기통을 고장내고 있다는 신고가 들어왔다.',[['😎 모른 척한다','점수 +500 / 돈 +30',()=>{score+=500;money+=30}],['🏃 더 세게 친다','내구도 -12 / 수압 +15',()=>{hp-=12;pressure+=15}],['🧑‍✈️ 사과한다','콤보 +2 / 점수 +150',()=>{score+=150;combo+=2}]]],
['📦 CJ 대한통운','엄마 이게 뭔지 알아요? CJ 대한통운이잖아요. 그런데 배송물이 변기통이다.',[['📦 개봉한다','랜덤 보상',()=>{let n=100+Math.floor(Math.random()*600);score+=n;money+=40}],['🚽 변기에 던진다','내구도 -18',()=>{hp-=18;pressure+=10}],['📞 반품한다','돈 +100 / 점수 +100',()=>{money+=100;score+=100}]]],
['🧻 휴지 대폭발','휴지가 멈추지 않는다. 지금 결단해야 한다.',[['🔥 계속 진행','점수 +800 / 내구도 -8',()=>{score+=800;hp-=8}],['🪠 뚫어뻥','수압 초기화 / 점수 +300',()=>{pressure=15;score+=300}],['🏃 도망','콤보 0 / 돈 +200',()=>{combo=0;money+=200}]]],
['🧑‍🔧 정비공 난입','정비공이 말했다. “제가 고쳐드릴까요?”',[['❌ 절대 안 돼','내구도 -10 / 점수 +400',()=>{hp-=10;score+=400}],['🤝 협상한다','돈 -50 / 선택 도구 +1레벨',()=>{money=Math.max(0,money-50);levels[selectedTool]++}],['🛠️ 공구를 뺏는다','정체불명 도구 +1레벨',()=>{levels.mystery++}]]],
['👻 변기통의 반격','변기통이 갑자기 움직이기 시작했다.',[['👊 맞서 싸운다','내구도 -15 / 점수 +1000',()=>{hp-=15;score+=1000}],['🏃 피한다','콤보 +5 / 수압 +20',()=>{combo+=5;pressure+=20}],['🗣️ 대화한다','숨겨진 보너스',()=>{score+=1500;money+=150}]]]
];
function randomEvent(){if(!running)return;let e=events[Math.floor(Math.random()*events.length)];$('eventTitle').textContent=e[0];$('eventDesc').textContent=e[1];let box=$('choices');box.innerHTML='';e[2].forEach(c=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+c[0]+'</b><small>'+c[1]+'</small>';b.onclick=()=>{$('eventModal').style.display='none';c[2]();hp=Math.max(0,hp);pressure=Math.min(100,pressure);update();beep(440,.1,'triangle',.035);if(hp<=0)end()};box.appendChild(b)});$('eventModal').style.display='flex';beep(600,.1,'triangle',.04);vib([30,30,60])}
function renderShop(){let g=$('shopGrid');g.innerHTML='';Object.keys(tools).forEach(t=>{let cost=tools[t].cost?tools[t].cost*(levels[t]+1):80*(levels[t]+1);let b=document.createElement('button');b.className='buy';b.innerHTML='<b>'+tools[t].name+' · Lv.'+levels[t]+'</b><small>강화 비용 💰 '+cost+'</small>';b.onclick=()=>{if(money<cost){$('msg').textContent='💸 돈이 부족하다.';beep(80,.1);return}money-=cost;levels[t]++;renderShop();update();beep(700,.08,'triangle',.03);$('msg').textContent=tools[t].name+' Lv.'+levels[t]+' 강화!'};g.appendChild(b)})}
function end(){if(!running)return;running=false;let e=score<3000?'🔧 정비공 엔딩 — “이건 좀 고쳐야겠는데요?”':score<7000?'🚽 공식 고장 엔딩 — 변기통이 완전히 작동을 멈췄다.':score<12000?'🚔 경찰 엔딩 — 경찰 순찰차 세 대가 현장에 도착했다.':score<20000?'📦 배송 엔딩 — CJ 대한통운 역사상 가장 이상한 배송 완료.':pressure>=80?'🌊 대홍수 엔딩 — 화장실의 수압이 전설이 되었다.':'👑 전설의 변기통 엔딩 — 당신은 변기통 역사에 이름을 남겼다.';$('ending').textContent=e;$('finalScore').textContent=score.toLocaleString();$('finalStats').textContent=`타격 ${taps}회 · 최대 콤보 x${maxCombo} · 보유금 💰 ${money}`;$('endModal').style.display='flex';[180,130,90].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sawtooth',.04),i*120));vib([100,50,100,50,250])}
function restart(){hp=100;pressure=20;score=0;money=0;combo=0;maxCombo=0;taps=0;selectedTool='hand';selectedPart='bowl';running=true;lastAction=0;Object.keys(levels).forEach(k=>levels[k]=1);$('endModal').style.display='none';document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('selected',b.dataset.tool==='hand'));update();$('msg').textContent='어디부터 고장낼까?'}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>selectTool(b.dataset.tool));document.querySelectorAll('.partBtn').forEach(b=>b.onclick=()=>selectPart(b.dataset.partSelect));document.querySelectorAll('.part').forEach(p=>p.onclick=e=>{selectPart(p.dataset.part);attack()});$('action').onclick=attack;$('shop').onclick=()=>{$('shopModal').style.display='flex';renderShop()};$('shopClose').onclick=()=>{$('shopModal').style.display='none'};$('restart').onclick=restart;$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();attack()}if(e.key.toLowerCase()==='s'){$('shopModal').style.display='flex';renderShop()}});update();
})();
</script>
</body></html>
